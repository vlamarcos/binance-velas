name: Velas Binance 1h
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  velas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar velas (só data-api.binance.vision)
        run: |
          set -e
          mkdir -p data
          for s in ETHUSDT BTCUSDT; do
            for i in 1h 15m; do
              curl -fsS --retry 3 --retry-delay 10 \
                "https://data-api.binance.vision/api/v3/klines?symbol=$s&interval=$i&limit=1000" \
                -o "data/${s}_${i}.json"
              python3 -c "import json; d=json.load(open('data/${s}_${i}.json')); assert len(d)>100; print('$s $i', len(d), d[-1][0], d[-1][4])"
            done
          done
          python3 .github/historico.py
          date -u +%Y-%m-%dT%H:%M:%SZ > data/atualizado.txt
      - name: Gravar no repositório
        run: |
          git config user.name "velas-bot"
          git config user.email "velas-bot@users.noreply.github.com"
          git pull --rebase || true
          git add data
          git commit -m "velas $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sem alterações"
          git push
